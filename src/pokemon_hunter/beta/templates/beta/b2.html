<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dex · Your collection</title><link rel="stylesheet" href="/collection-assets/glass.css"><link rel="stylesheet" href="/collection-assets/collection-base.css"><link rel="stylesheet" href="/collection-assets/collection-browse.css"><script src="/collection-assets/navigation.js" defer></script><script src="/collection-assets/bounded-reads.js" defer></script><script src="/collection-assets/collection.js" defer></script><script src="/collection-assets/card-screens.js" defer></script>{% if parity %}<script src="/collection-assets/parity.js" defer></script>{% endif %}<script src="/collection-assets/pokedex.js" defer></script><script src="/collection-assets/goals-screen.js" defer></script><script src="/collection-assets/species-screens.js" defer></script></head>
<body data-navigation-account="{{ navigation_account_id }}" data-navigation-binding="{{ navigation_binding }}" class="collecting-page" data-parity="{{ parity|yesno:'true,false' }}" data-staging="{{ staging|yesno:'true,false' }}"><a class="skip" href="#main">Skip to content</a>{% include 'beta/header.html' %}
<main id="main"><div id="status" role="status" aria-live="polite"></div><div id="content"><h1>Loading your collection…</h1></div></main>
<dialog id="editor" aria-labelledby="editor-title"><div class="dialog-head"><h2 id="editor-title">Copy details</h2><button type="button" data-close="editor" aria-label="Close copy details">Close</button></div><div id="editor-body"></div></dialog>
<dialog id="review" aria-labelledby="review-title"><div class="dialog-head"><h2 id="review-title">Review changes</h2><button type="button" data-close="review" aria-label="Close review">Close</button></div><div id="review-body"></div><p id="review-error" role="alert"></p><div class="actions"><button id="confirm" type="button">Confirm changes</button><button id="undo" type="button" hidden>Undo this operation</button></div></dialog>
<noscript><p>This collection interface needs JavaScript. Your existing data has not changed.</p></noscript></body></html>
