name: Scheduled assurance
'on':
  schedule:
  - cron: 23 9 * * 0
  workflow_dispatch:
    inputs:
      scope:
        description: Merge checks or additional supported runtime coverage
        type: choice
        options:
        - full
        - compatibility
        - performance-diagnostic
        - native-diagnostic
        - bulk-goal-diagnostic
        default: full
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.scope || 'scheduled' }}
  cancel-in-progress: false
jobs:
  inputs:
    name: Validate diagnostic scope
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
    - name: Validate typed dispatch input
      env:
        EVENT: ${{ github.event_name }}
        SCOPE: ${{ inputs.scope }}
      run: |-
        if [[ "$EVENT" == workflow_dispatch && "$SCOPE" != full && "$SCOPE" != compatibility && "$SCOPE" != performance-diagnostic && "$SCOPE" != native-diagnostic && "$SCOPE" != bulk-goal-diagnostic ]]; then
          echo "Invalid diagnostic scope" >&2
          exit 1
        fi
  ci:
    name: CI
    if: ${{ inputs.scope != 'performance-diagnostic' && inputs.scope != 'native-diagnostic' && inputs.scope != 'bulk-goal-diagnostic' }}
    needs: inputs
    uses: ./.github/workflows/validate.yml
    with:
      compatibility: ${{ github.event_name == 'schedule' || inputs.scope == 'compatibility' }}
  health:
    name: Bounded CI health
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Last 30 completed runs within 30 days
      continue-on-error: true # Advisory telemetry outage must not obscure the required CI gate.
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/ci/health.py --repository "$GITHUB_REPOSITORY" --with-resources --output reports/ci/health/metrics.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: health-${{ github.run_id }}-${{ github.run_attempt }}
        path: reports/ci/health/
        if-no-files-found: error
        retention-days: 30
    permissions:
      contents: read
      actions: read
  container:
    name: Scheduled container build
    if: ${{ github.event_name == 'schedule' || inputs.scope == 'compatibility' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Build without publishing and check installed runtime
      id: build
      run: |
        docker build --pull --progress plain --file deploy/Dockerfile --tag dex-ci-candidate .
        docker run --rm --network none --entrypoint /app/.venv/bin/python dex-ci-candidate -c "import os, django, psycopg; from pokemon_hunter.beta.canonical_species import registry; assert os.geteuid() == 10001; assert len(registry()) == 1025"
        mkdir -p reports/ci/container
        docker image inspect dex-ci-candidate --format '{"status":"PASS","image_bytes":{{.Size}},"image_id":"{{.Id}}","platform":"{{.Os}}/{{.Architecture}}"}' > reports/ci/container/report.json
    - name: Container result summary
      if: always()
      env:
        BUILD: ${{ steps.build.outcome }}
      run: python3 scripts/ci/report.py job --name "Scheduled container build" --output reports/ci/container/metrics.json --outcome "build=$BUILD" --measurement reports/ci/container/report.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: container-${{ github.run_id }}-${{ github.run_attempt }}
        path: reports/ci/container/
        if-no-files-found: error
        retention-days: 14

  performance-diagnostic:
    name: Diagnostic only (${{ matrix.os }}, Python 3.14)
    needs: inputs
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'performance-diagnostic' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup
      with:
        python-version: '3.14'
    - name: Install the same pinned Chromium
      run: uv run --no-sync playwright install --with-deps chromium
    - name: Bounded profiling and browser instrumentation comparison (not acceptance)
      run: uv run --no-sync pytest -q tests/ci_perf_probe.py --disable-socket --allow-unix-socket --junitxml=reports/ci/perf-diagnostic/probes.xml
    - name: Separate unprofiled representative budget gates (not full qualification)
      if: ${{ !cancelled() }}
      run: uv run --no-sync pytest -q tests/test_catalog_read_performance.py tests/test_account_read_performance.py tests/test_ops_runtime.py --disable-socket --allow-unix-socket --junitxml=reports/ci/perf-diagnostic/budgets.xml
    - name: Separate corrected browser budget gates (not full qualification)
      if: ${{ !cancelled() }}
      run: uv run --no-sync pytest -q tests/test_perf04_browser.py tests/test_perf04_interactions.py --disable-socket --allow-unix-socket --junitxml=reports/ci/perf-diagnostic/browser-budgets.xml
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: diagnostic-only-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          reports/ci/perf-diagnostic/
          reports/perf02/
          reports/perf03/
          reports/perf04/
          reports/ops-readiness/
        if-no-files-found: error
        retention-days: 14

  native-diagnostic:
    name: Native diagnostic only (Ubuntu, Python 3.12.16)
    needs: inputs
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'native-diagnostic' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup
      with:
        python-version: '3.12.16'
    - name: Prepare native debugger and pinned Chromium
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends gdb
        uv run --no-sync playwright install --with-deps chromium
        mkdir -p reports/ci/native-diagnostic
        git rev-parse HEAD HEAD^{tree} > reports/ci/native-diagnostic/source.txt
        sha256sum uv.lock > reports/ci/native-diagnostic/lock.txt
        uv run --no-sync python -VV > reports/ci/native-diagnostic/python.txt
        uv run --no-sync python -c 'import json, platform, sqlite3, greenlet; print(json.dumps({"platform": platform.platform(), "sqlite": sqlite3.sqlite_version, "greenlet": greenlet.__version__}))' > reports/ci/native-diagnostic/native-versions.json
        uv pip freeze > reports/ci/native-diagnostic/dependencies.txt
    - name: Bounded synthetic controls and native backtrace (not acceptance)
      run: |
        ulimit -c 0
        for mode in sqlite greenlet primed-sqlite; do
          for timer in off on; do
            args=()
            if [[ "$timer" == on ]]; then args+=(--timer); fi
            for trial in 1 2 3; do
              result=0
              timeout 30s gdb --batch --return-child-result \
                -ex 'set pagination off' -ex 'set print frame-arguments none' \
                -ex run -ex 'thread apply all bt 30' \
                --args .venv/bin/python scripts/ci/native_crash_probe.py "$mode" "${args[@]}" \
                > "reports/ci/native-diagnostic/$mode-$timer-$trial.log" 2>&1 || result=$?
              echo "$mode $timer $trial $result" >> reports/ci/native-diagnostic/probe-exits.txt
            done
          done
        done
    - name: Original full suite under debugger with unchanged 90-second diagnostics
      if: ${{ !cancelled() }}
      run: |
        ulimit -c 0
        # Python normally ignores SIGPIPE and raises BrokenPipeError. GDB must
        # pass it through, while still stopping on the target SIGSEGV.
        result=0
        timeout 30s gdb --batch --return-child-result \
          -ex 'handle SIGPIPE nostop noprint pass' \
          -ex 'info signals SIGPIPE' -ex 'info signals SIGSEGV' -ex run \
          --args .venv/bin/python -c 'import os; r,w=os.pipe(); os.close(r); os.write(w,b"probe")' \
          > reports/ci/native-diagnostic/sigpipe-policy.log 2>&1 || result=$?
        test "$result" -eq 1
        grep -q BrokenPipeError reports/ci/native-diagnostic/sigpipe-policy.log
        ! grep -q 'received signal SIGPIPE' reports/ci/native-diagnostic/sigpipe-policy.log
        timeout 40m gdb --batch --return-child-result \
          -ex 'set pagination off' -ex 'set print frame-arguments none' \
          -ex 'handle SIGPIPE nostop noprint pass' \
          -ex run -ex 'thread apply all bt 30' \
          --args .venv/bin/python -m pytest -q --durations=15 \
          --disable-socket --allow-unix-socket \
          --junitxml=reports/ci/native-diagnostic/junit.xml \
          --cov=pokemon_hunter --cov-branch \
          --cov-report=json:reports/ci/native-diagnostic/coverage.json \
          > reports/ci/native-diagnostic/full-suite.log 2>&1
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: native-diagnostic-only-${{ github.run_id }}-${{ github.run_attempt }}
        path: reports/ci/native-diagnostic/
        if-no-files-found: error
        retention-days: 14

  bulk-goal-diagnostic:
    name: Bulk goal diagnostic only (Python 3.12.16)
    needs: inputs
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'bulk-goal-diagnostic' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup
      with:
        python-version: '3.12.16'
    - name: Prepare pinned browser and identities
      run: |
        uv run --no-sync playwright install --with-deps chromium
        mkdir -p reports/ci/bulk-goal
        git rev-parse HEAD HEAD^{tree} > reports/ci/bulk-goal/source.txt
        sha256sum uv.lock > reports/ci/bulk-goal/lock.txt
        uv run --no-sync python -VV > reports/ci/bulk-goal/python.txt
        uv pip freeze > reports/ci/bulk-goal/dependencies.txt
    - name: Focused original test with transition evidence
      env:
        DEX_GOAL_DIAGNOSTIC_OUT: reports/ci/bulk-goal/focused
      run: |
        uv run --no-sync python -m pytest -p scripts.ci.bulk_goal_diagnostic -q 'tests/test_perf04_workflows.py::test_custom_goal_keeps_members_and_labels_across_search_and_pages[bulk]' --disable-socket --allow-unix-socket --junitxml=reports/ci/bulk-goal/focused/junit.xml > reports/ci/bulk-goal/focused.log 2>&1
    - name: Original test-order prefix through bulk goal
      if: ${{ !cancelled() }}
      env:
        DEX_GOAL_PREFIX: '1'
        DEX_GOAL_DIAGNOSTIC_OUT: reports/ci/bulk-goal/prefix
      run: |
        uv run --no-sync python -m pytest -p scripts.ci.bulk_goal_diagnostic -q --disable-socket --allow-unix-socket --junitxml=reports/ci/bulk-goal/prefix/junit.xml > reports/ci/bulk-goal/prefix.log 2>&1
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: bulk-goal-diagnostic-only-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          reports/ci/bulk-goal/
          reports/perf02/
          reports/perf03/
          reports/perf04/
          reports/ops-readiness/
        if-no-files-found: error
        retention-days: 14
