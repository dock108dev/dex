name: Tests
'on':
  push:
    branches:
    - main
  pull_request: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    name: CI
    uses: ./.github/workflows/validate.yml
    with:
      compatibility: false
