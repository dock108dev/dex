name: Locked Python environment
description: Install reproducible tools without application credentials.
inputs:
  python-version:
    description: Supported Python runtime
    required: true
runs:
  using: composite
  steps:
  # Keep supported minor versions on maintained patch releases. The pinned uv
  # catalog predates Python's 3.14.5 GC correction and otherwise selects 3.14.0.
  - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
    id: python
    with:
      python-version: ${{ inputs.python-version }}
      check-latest: true
  - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
    with:
      version: 0.9.10
      enable-cache: true
      cache-dependency-glob: uv.lock
      cache-suffix: ${{ runner.os }}-${{ runner.arch }}-${{ inputs.python-version }}-ci
  - name: Install locked application and check tools
    shell: bash
    env:
      UV_PYTHON: ${{ steps.python.outputs.python-path }}
    run: |
      uv sync --locked --extra dev --extra ci
      # Subsequent no-build-isolation builds need the locked backend in .venv,
      # not the bare interpreter that was used to create it.
      echo "UV_PYTHON=$PWD/.venv/bin/python" >> "$GITHUB_ENV"
