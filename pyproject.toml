[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pokemon-hunter"
version = "0.1.0"
description = "A small, conservative daily eBay watcher for vintage Pokemon lots"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-axes>=8.3,<9",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pillow>=11,<13",
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
pokemon-hunter = "pokemon_hunter.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
